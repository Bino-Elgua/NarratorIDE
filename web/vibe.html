<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Coder - AI Pair Programming with Voice</title>

  <!-- Monaco Editor -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/xterm-addon-fit.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ────────────────────────────────────────────────── */
    .vibe-header {
      height: 54px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .vibe-logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .vibe-prompt-bar {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .vibe-prompt-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .vibe-prompt-input:focus { border-color: #667eea; }
    .vibe-prompt-input:disabled { opacity: 0.5; }

    .vibe-send-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .vibe-send-btn:hover { opacity: 0.9; }
    .vibe-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .vibe-icon-btn {
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 16px;
    }
    .vibe-icon-btn:hover { background: #222; }

    .vibe-select {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    /* ── Main Layout ───────────────────────────────────────────── */
    .vibe-container {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 1fr 180px;
      height: calc(100vh - 54px);
      gap: 1px;
      background: #1a1a1a;
    }

    /* ── Sidebar / File Tree ───────────────────────────────────── */
    .vibe-sidebar {
      background: #111;
      padding: 12px;
      overflow-y: auto;
      font-size: 13px;
    }

    .vibe-sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .vibe-file-item {
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .vibe-file-item:hover { background: #1a1a1a; }
    .vibe-file-item.active { background: #222; color: #667eea; }

    /* ── Editor ────────────────────────────────────────────────── */
    .vibe-editor-area {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .vibe-tabs {
      display: flex;
      background: #111;
      border-bottom: 1px solid #222;
      overflow-x: auto;
      min-height: 36px;
    }

    .vibe-tab {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      border-right: 1px solid #1a1a1a;
      white-space: nowrap;
      color: #888;
      transition: color 0.15s;
    }
    .vibe-tab:hover { color: #ccc; }
    .vibe-tab.active {
      background: #0a0a0a;
      color: #e0e0e0;
      border-bottom: 2px solid #667eea;
    }

    #monaco-container { flex: 1; overflow: hidden; }

    /* ── Right Panel ───────────────────────────────────────────── */
    .vibe-right-panel {
      background: #111;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Narration */
    .vibe-narration {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vibe-narration-header {
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vibe-narration-header::before { content: '🔊'; }
    .vibe-narration-header.speaking::before { animation: pulse 1s infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .vibe-thought-bubble {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      border-left: 3px solid #667eea;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .vibe-thought-persona {
      font-size: 10px;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .vibe-action-bubble { border-left-color: #f59e0b; }
    .vibe-action-icon { font-size: 14px; }

    /* Chat */
    .vibe-chat {
      height: 260px;
      border-top: 1px solid #222;
      display: flex;
      flex-direction: column;
    }

    .vibe-chat-header {
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-bottom: 1px solid #1a1a1a;
    }

    .vibe-chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vibe-chat-message {
      max-width: 88%;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .vibe-chat-message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .vibe-chat-message.ai {
      align-self: flex-start;
      background: #1a1a1a;
    }

    .vibe-chat-input-area {
      padding: 8px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      gap: 6px;
    }

    .vibe-chat-input {
      flex: 1;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      resize: none;
    }

    /* ── Terminal ───────────────────────────────────────────────── */
    .vibe-terminal {
      background: #0a0a0a;
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #222;
    }

    .vibe-terminal-header {
      padding: 6px 14px;
      background: #111;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
    }

    #terminal-container { flex: 1; padding: 4px 8px; }

    /* ── Status Bar ────────────────────────────────────────────── */
    .vibe-status {
      position: fixed;
      bottom: 180px;
      left: 220px;
      right: 280px;
      height: 24px;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 11px;
      gap: 18px;
      z-index: 10;
    }

    .vibe-status-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #888;
    }

    .vibe-status-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
    }
    .vibe-status-indicator.thinking,
    .vibe-status-indicator.coding {
      background: #f59e0b;
      animation: blink 1s infinite;
    }
    .vibe-status-indicator.speaking { background: #667eea; animation: blink 0.8s infinite; }
    .vibe-status-indicator.ready { background: #10b981; }
    .vibe-status-indicator.disconnected { background: #ef4444; }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="vibe-header">
    <div class="vibe-logo">Vibe Coder</div>
    <div class="vibe-prompt-bar">
      <input type="text" class="vibe-prompt-input" id="main-prompt"
             placeholder="Describe what you want to build...">
      <button class="vibe-send-btn" id="send-btn">Build</button>
      <button class="vibe-icon-btn" id="stop-btn" title="Stop session">&#9632;</button>
      <button class="vibe-icon-btn" id="mute-btn" title="Toggle audio">🔊</button>
    </div>
    <select id="persona-select" class="vibe-select">
      <option value="javascript">JS - Chaos Agent</option>
      <option value="python">Python - Gen-Z</option>
      <option value="rust">Rust - Engineer</option>
      <option value="typescript">TS - Careful Editor</option>
      <option value="go">Go - Pragmatist</option>
      <option value="java">Java - Corporate</option>
      <option value="c">C - Elder Craftsman</option>
      <option value="lisp">Lisp - Philosopher</option>
    </select>
  </header>

  <!-- ── Main Container ──────────────────────────────────────── -->
  <div class="vibe-container">

    <!-- Sidebar -->
    <aside class="vibe-sidebar">
      <div class="vibe-sidebar-title">Explorer</div>
      <div id="file-tree">
        <div class="vibe-file-item" style="color:#666;font-style:italic;">No files yet</div>
      </div>
    </aside>

    <!-- Editor -->
    <main class="vibe-editor-area">
      <div class="vibe-tabs" id="tabs"></div>
      <div id="monaco-container"></div>
    </main>

    <!-- Right Panel -->
    <aside class="vibe-right-panel">
      <div class="vibe-narration" id="narration-panel">
        <div class="vibe-narration-header" id="narration-status">AI Thinking</div>
      </div>
      <div class="vibe-chat">
        <div class="vibe-chat-header">Chat</div>
        <div class="vibe-chat-history" id="chat-history">
          <div class="vibe-chat-message ai">Hey! Tell me what you want to build and I'll code it with live narration.</div>
        </div>
        <div class="vibe-chat-input-area">
          <textarea class="vibe-chat-input" id="chat-input" rows="1" placeholder="Follow-up..."></textarea>
          <button class="vibe-send-btn" id="chat-send-btn" style="padding:8px 14px;font-size:13px;">Send</button>
        </div>
      </div>
    </aside>

    <!-- Terminal -->
    <div class="vibe-terminal">
      <div class="vibe-terminal-header">
        <span>Terminal</span>
        <button id="clear-terminal" style="background:none;border:none;color:#666;cursor:pointer;font-size:11px;">Clear</button>
      </div>
      <div id="terminal-container"></div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="vibe-status">
    <div class="vibe-status-item">
      <div class="vibe-status-indicator" id="coder-status"></div>
      <span id="coder-status-text">Coder: Idle</span>
    </div>
    <div class="vibe-status-item">
      <div class="vibe-status-indicator" id="narrator-status"></div>
      <span id="narrator-status-text">Narrator: Idle</span>
    </div>
    <div class="vibe-status-item" style="margin-left:auto;">
      <span id="current-file">—</span>
    </div>
  </div>

  <script type="module">
    import { VibeApp } from './js/vibe-app.js';
    const app = new VibeApp();
    app.init();
  </script>
</body>
</html>
